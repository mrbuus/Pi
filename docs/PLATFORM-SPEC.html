    table.rsp td { border: 0; padding: 2px 0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* 6 — NFR */
section("nfr", "6", "Функциональ бус шаардлага — олон улсын стандарт", `
  <p class="lead">Олон улсын startup-ууд нээлтийн өмнө заавал хангадаг суурь шаардлагууд, Pi.mn-ийн одоогийн байдалтай нь.</p>
  ${NFR.map((a) => `<h3>${esc(a.area)} <span class="muted">— ${esc(a.std)}</span></h3>
    <div class="tablewrap"><table><tr><th>Шаардлага</th><th>Төлөв</th><th>Тайлбар</th></tr>${a.items.map(([x, s, n]) => `<tr data-st="${s}"><td>${esc(x)}</td><td>${st(s)}</td><td class="muted">${esc(n)}</td></tr>`).join("")}</table></div>`).join("")}
`, () => "## 6. Функциональ бус шаардлага\n\n" + NFR.map((a) => `### ${a.area} (${a.std})\n| Шаардлага | Төлөв | Тайлбар |\n|---|---|---|\n` + a.items.map(([x, s, n]) => `| ${x} | ${ST_LABEL[s]} | ${n} |`).join("\n")).join("\n\n"), "Техник");

/* 7 — Цоорхой */
section("gaps", "7", "Цоорхойн бүртгэл — юу дутуу, юу эвдэрсэн", `
  <p class="lead">${GAPS.length} цоорхой: ${GAPS.filter((g) => g[7] === "done").length} засагдсан, ${GAPS.filter((g) => g[7] !== "done").length} нээлттэй. ID-г commit мессежид ашигла.</p>
  <div class="dash">${["P0", "P1", "P2", "P3"].map((p) => { const all = GAPS.filter((g) => g[1] === p), d = all.filter((g) => g[7] === "done").length; return `<div class="card"><b><span class="pri ${p}">${p}</span> ${d}/${all.length} засагдсан</b><div class="meter"><span class="m-ok" style="width:${all.length ? (d / all.length) * 100 : 0}%"></span></div></div>`; }).join("")}</div>
  <p><label><input type="checkbox" id="gapOpenOnly"> Зөвхөн нээлттэйг харуулах</label></p>
  <div class="tablewrap"><table class="rsp" id="gapTable"><tr><th>ID</th><th>Эрэмбэ</th><th>Төлөв</th><th>Юу</th><th>Хаана</th><th>Яах вэ</th><th>Хувилбар</th></tr>
  ${GAPS.map(([id, p, c, t, w, f, v, d]) => `<tr data-ver="${v}" data-gap="${d}" class="${d === "done" ? "done-row" : ""}"><td><b>${id}</b> <span class="pri ${p}">${p}</span></td><td><span class="pri ${p}">${p}</span> <span class="muted">${esc(c)}</span></td><td>${d === "done" ? '<span class="st ok">Засагдсан</span>' : '<span class="st part">Нээлттэй</span>'}</td><td><b>${esc(t)}</b></td><td><code>${esc(w)}</code></td><td>${esc(f)}</td><td><span class="ver">${v}</span></td></tr>`).join("")}
  </table></div>
`, () => "## 7. Цоорхойн бүртгэл\n\n| ID | Эрэмбэ | Ангилал | Юу | Хаана | Яах вэ | Хувилбар | Төлөв |\n|---|---|---|---|---|---|---|---|\n" + GAPS.map((r) => `| ${r.slice(0, 7).join(" | ")} | ${r[7] === "done" ? "Засагдсан" : "Нээлттэй"} |`).join("\n"), "Төлөвлөгөө");

/* 8 — Roadmap */
section("roadmap", "8", "Хувилбарын төлөвлөгөө", `
  ${ROADMAP.map((r) => `<div class="card" style="margin:10px 0"><b>${esc(r.v)}</b><p class="muted">${esc(r.goal)}</p><ul class="gaps">${r.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}
  <h3>Ажлын дүрэм (Definition of Done)</h3>
  <ul class="gaps">
    <li><code>cd api && npx tsc --noEmit && npx jest</code> ногоон</li>
    <li><code>cd web && npx tsc --noEmit && npm run build</code> ногоон — tsc хангалтгүй</li>
    <li><code>npm run smoke</code> — 4 дүр × бүх маршрут, 5xx байхгүй, эрхгүй хүнд 403</li>
    <li>Апп боох шалгалт (STATUS §2): «Nest can't resolve» 0, «/api/api» 0</li>
    <li>Эзний дүрэм: LaTeX, emoji/глиф байхгүй, өнгөний токен, 375px, хоосон/ачаалж буй/алдааны төлөв</li>
    <li>Энэ баримт + STATUS.md шинэчлэгдсэн</li>
  </ul>
`, () => "## 8. Хувилбарын төлөвлөгөө\n\n" + ROADMAP.map((r) => `### ${r.v}\n${r.goal}\n` + r.items.map((x) => "- " + x).join("\n")).join("\n\n"), "Төлөвлөгөө");

/* 9 — Асуултууд */
section("questions", "9", "Эзний шийдвэр хүлээж буй асуултууд", `
  <ol class="steps">${QUESTIONS.map((q) => `<li>${esc(q)}</li>`).join("")}</ol>
`, () => "## 9. Эзний шийдвэр хүлээж буй асуултууд\n\n" + QUESTIONS.map((q, i) => `${i + 1}. ${q}`).join("\n"), "Төлөвлөгөө");

/* 10 — API */
function apiTable(filterNoUi) {
  const rows = ENDPOINTS.filter((e) => !filterNoUi || !e.ui);
  const mods = [...new Set(rows.map((e) => e.mod))].sort();
  return mods.map((mod) => {
    const r = rows.filter((e) => e.mod === mod), noUi = r.filter((e) => !e.ui).length;
    return `<details class="apimod"><summary>${esc(mod)} <span class="muted">${r.length} маршрут</span>${noUi ? ` <span class="st none">${noUi} UI-гүй</span>` : ""}</summary><div class="tablewrap"><table class="rsp"><tr><th>Маршрут</th><th>Эрх</th><th>Вэбэд</th></tr>${r.map((e) => `<tr><td><code>${e.m} /api${esc(e.p)}</code></td><td>${e.roles.map((x) => `<span class="role">${esc(ROLE_NAME[x] || x)}</span>`).join("")}</td><td>${e.ui ? st("ok") : st("none")}</td></tr>`).join("")}</table></div></details>`;
  }).join("");
}
section("api", "10", "API каталог (кодоос автоматаар)", `
  <p class="lead">${ENDPOINTS.length} маршрут, үүнээс ${ENDPOINTS.filter((e) => !e.ui).length} нь вэбээс дуудагддаггүй (backend бэлэн, UI дутуу — эсвэл илүүдэл). «нэвтэрсэн бүгд» гэсэн маршрутуудыг G04-ийн дагуу эрхийн аудит хийнэ. Динамик замаар дуудагддаг цөөн маршрут «ашиглагдаагүй» гэж андуурагдсан байж болно.</p>
  <p><label><input type="checkbox" id="apiNoUi"> Зөвхөн UI-гүйг харуулах</label></p>
  <div id="apiBox">${apiTable(false)}</div>
`, () => "## 10. API каталог\n\n| Модуль | Арга | Зам | Эрх | Вэбэд |\n|---|---|---|---|---|\n" + ENDPOINTS.map((e) => `| ${e.mod} | ${e.m} | /api${e.p} | ${e.roles.map((r) => ROLE_NAME[r] || r).join(", ")} | ${e.ui ? "тийм" : "үгүй"} |`).join("\n"), "Техник");

/* ---------- Байршуулах ---------- */
const main = $("#main"), toc = $("#toc");
let lastGrp = "";
for (const s of SECTIONS) {
  const el = document.createElement("section");
  el.className = "sec"; el.id = s.id;
  el.innerHTML = `<div class="sec-actions"><button class="btn" type="button" data-copy="${s.id}">Markdown хуулах</button></div><h2>${s.num}. ${esc(s.title)}</h2>${s.html}`;
  main.appendChild(el);
  if (s.grp !== lastGrp) { toc.insertAdjacentHTML("beforeend", `<div class="grp">${esc(s.grp)}</div>`); lastGrp = s.grp; }
  toc.insertAdjacentHTML("beforeend", `<a href="#${s.id}"><span class="num">${s.num}</span>${esc(s.title)}</a>`);
  if (s.id === "modules") MODULES.forEach((m) => toc.insertAdjacentHTML("beforeend", `<a href="#m-${m.id}" style="padding-left:36px;font-size:12.5px">${esc(m.t)}</a>`));
}

/* ---------- Хүснэгтийг гар утсанд карт болгох ---------- */
function labelTables(root = document) {
  root.querySelectorAll("table:not(.matrix)").forEach((t) => {
    t.classList.add("rsp");
    const heads = [...t.querySelectorAll("tr:first-child th")].map((th) => th.textContent.trim());
    t.querySelectorAll("tr").forEach((tr) => [...tr.children].forEach((td, i) => { if (td.tagName === "TD" && heads[i]) td.dataset.label = heads[i]; }));
  });
}
labelTables();

/* ---------- Тойм самбар (§0) ---------- */
(function dashboard() {
  const box = document.getElementById("dash"); if (!box) return;
  const cnt = (arr, k) => arr.filter((x) => x === k).length;
  const bar = (arr) => { const n = arr.length || 1; return `<div class="meter">${["ok", "part", "bug", "none"].map((k) => `<span class="m-${k}" style="width:${(cnt(arr, k) / n) * 100}%"></span>`).join("")}</div><div class="legend">${["ok", "part", "bug", "none"].map((k) => `<span>${ST_LABEL[k]} ${cnt(arr, k)}</span>`).join("")}</div>`; };
  const mods = MODULES.map((m) => m.st), acts = MODULES.flatMap((m) => m.screens.flatMap((s) => s.actions.map((a) => a[4]))), nfr = NFR.flatMap((a) => a.items.map((i) => i[1]));
  const gOpen = GAPS.filter((g) => g[7] !== "done"), p0 = gOpen.filter((g) => g[1] === "P0").length;
  box.innerHTML = `
    <div class="card"><b>Модуль (${mods.length})</b>${bar(mods)}</div>
    <div class="card"><b>Товч, үйлдэл (${acts.length})</b>${bar(acts)}</div>
    <div class="card"><b>Олон улсын стандарт (${nfr.length})</b>${bar(nfr)}</div>
    <div class="card"><b>Цоорхой: ${gOpen.length} нээлттэй / ${GAPS.length}</b><div class="legend"><span>Яаралтай P0 нээлттэй: <b style="color:var(--bug)">${p0}</b></span></div><a href="#gaps">Цоорхойн бүртгэл рүү</a></div>`;
})();

/* ---------- Хуулах ---------- */
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Хуулагдлаа — ChatGPT руу буулгана уу"); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Хуулагдлаа"); }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy]"); if (b) { const s = SECTIONS.find((x) => x.id === b.dataset.copy); copy(s.md()); }
  const m = e.target.closest("[data-copy-mod]"); if (m) copy(moduleMd(MODULES.find((x) => x.id === m.dataset.copyMod)));
});
$("#copyAll").onclick = () => copy(SECTIONS.map((s) => s.md()).join("\n\n---\n\n"));
$("#expandAll").onclick = () => document.querySelectorAll("details.mod").forEach((d) => (d.open = true));
$("#collapseAll").onclick = () => document.querySelectorAll("details.mod").forEach((d) => (d.open = false));
$("#apiNoUi").onchange = (e) => { $("#apiBox").innerHTML = apiTable(e.target.checked); labelTables($("#apiBox")); if (e.target.checked) $("#apiBox").querySelectorAll("details").forEach((d) => (d.open = true)); };
$("#gapOpenOnly").onchange = (e) => document.querySelectorAll("#gapTable tr[data-gap=done]").forEach((tr) => tr.classList.toggle("hidden", e.target.checked));
const tocEl = $("#toc"), tocBtn = $("#tocBtn");
tocEl.insertAdjacentHTML("afterbegin", '<button class="btn toc-close" type="button" id="tocClose">Хаах</button>');
function setToc(open) { tocEl.classList.toggle("open", open); tocBtn.setAttribute("aria-expanded", String(open)); document.body.style.overflow = open ? "hidden" : ""; }
tocBtn.onclick = () => setToc(!tocEl.classList.contains("open"));
$("#tocClose").onclick = () => setToc(false);
tocEl.addEventListener("click", (e) => { if (e.target.closest("a")) setToc(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setToc(false); });
$("#ctrlBtn").onclick = () => { const c = $("#ctrls"), o = !c.classList.contains("open"); c.classList.toggle("open", o); $("#ctrlBtn").setAttribute("aria-expanded", String(o)); };

/* ---------- Шүүлтүүр ба хайлт ---------- */
function applyFilters() {
  const q = $("#q").value.trim().toLowerCase(), fs = $("#fStatus").value, fv = $("#fVer").value;
  document.querySelectorAll("details.mod").forEach((d) => {
    const okS = !fs || d.dataset.st === fs || d.querySelector(`tr[data-st="${fs}"]`);
    const okV = !fv || d.dataset.ver === fv;
    const okQ = !q || d.textContent.toLowerCase().includes(q);
    d.classList.toggle("hidden", !(okS && okV && okQ));
    if (q && okQ) d.open = true;
  });
  document.querySelectorAll("#gaps tr[data-ver], #api tr, #nfr tr[data-st]").forEach((tr) => {
    const okV = !fv || !tr.dataset.ver || tr.dataset.ver === fv;
    const okS = !fs || !tr.dataset.st || tr.dataset.st === fs;
    const okQ = !q || tr.textContent.toLowerCase().includes(q) || tr.querySelector("th");
    tr.classList.toggle("hidden", !(okV && okS && okQ));
  });
}
["input", "change"].forEach((ev) => { $("#q").addEventListener(ev, applyFilters); });
$("#fStatus").addEventListener("change", applyFilters);
$("#fVer").addEventListener("change", applyFilters);

/* ---------- Hash холбоос (#m-payments гэх мэт) ---------- */
function openHash() { const id = decodeURIComponent(location.hash.slice(1)); const el = id && document.getElementById(id); if (el && el.tagName === "DETAILS") el.open = true; }
window.addEventListener("hashchange", openHash); openHash();
</script>
</body>
</html>
