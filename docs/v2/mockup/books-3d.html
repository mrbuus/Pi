<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Номын 3D — студи</title>
<style>
  :root { --bg: #FAF9F6; --ink: #1B1B18; --ink-dim: #5E5A52; --line: #E4E1DA; --book: #6B2A8E; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 120px; }
  .note { font-size: 13px; color: var(--ink-dim); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; background: #fff; }
  .spacer { height: 36vh; display: grid; place-items: end center; color: var(--ink-dim); font-size: 13px; padding-bottom: 12px; }
  .studio { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 4 / 5; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; transition: background .5s; }
  @media (min-width: 860px) { .studio { aspect-ratio: 16 / 10; } }
  .studio:active { cursor: grabbing; }
  /* Бараан студи: номын ард зөөлөн гэрлийн толбо, ирмэгээрээ харанхуйлна */
  .studio.dark {
    background:
      radial-gradient(48% 38% at 50% 44%, rgba(120,92,140,.42) 0%, rgba(120,92,140,0) 70%),
      radial-gradient(70% 24% at 50% 82%, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 70%),
      radial-gradient(120% 90% at 50% 40%, #2A2630 0%, #151318 58%, #0B0A0D 100%);
  }
  .studio.light {
    background:
      radial-gradient(55% 42% at 50% 42%, #FFFFFF 0%, rgba(255,255,255,0) 72%),
      radial-gradient(120% 90% at 50% 40%, #F1EEE9 0%, #E2DDD5 64%, #CFC9BF 100%);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; }
  .fallback img { width: 52%; max-width: 280px; box-shadow: 0 30px 50px -20px rgba(0,0,0,.5); }
  .ctrl { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2; }
  .studio.light .ctrl { background: rgba(0,0,0,.06); }
  .ctrl button { font: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 6px 12px; min-height: 32px; background: transparent; color: rgba(255,255,255,.75); cursor: pointer; }
  .studio.light .ctrl button { color: #55504A; }
  .ctrl button[aria-pressed="true"] { background: rgba(255,255,255,.92); color: #1B1B18; }
  .lights { display: flex; justify-content: center; gap: 4px; margin: 12px auto 0; width: max-content; padding: 4px; border-radius: 999px; background: #EFECE6; }
  .lights button { font: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 6px 10px; min-height: 32px; background: transparent; color: #8A847B; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .lights button i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; }
  .lights button[aria-pressed="true"] { color: #1B1B18; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .lights button[aria-pressed="true"] i { background: #FFD27A; opacity: 1; box-shadow: 0 0 8px #FFD27A; }
  .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: rgba(255,255,255,.5); pointer-events: none; }
  .studio.light .hint { color: #7A756C; }
  .kicker { margin-top: 22px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--book); font-weight: 700; }
  h1 { font-size: clamp(26px, 6.4vw, 34px); margin: 6px 0 0; letter-spacing: -.015em; line-height: 1.15; }
  .meta { color: var(--ink-dim); font-size: 14px; margin-top: 6px; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div class="wrap">
  <p class="note">Three.js студи. Хэвлэлийн хавтасны файлаас. Гүйлгэхэд эргэнэ, хажуу тийш чирнэ.</p>
  <div class="spacer">Доош гүйлгэ</div>

  <div class="studio dark" id="studio">
    <div class="fallback" id="fallback"><img src="img/100x100-front.jpg" alt="Математикийн тестүүд, I дэвтэр"></div>
    <div class="ctrl" role="group" aria-label="Студийн фон">
      <button data-mode="dark" aria-pressed="true">Бараан</button>
      <button data-mode="light" aria-pressed="false">Цайвар</button>
    </div>
    <div class="hint">Гүйлгэхэд эргэнэ · хажуу тийш чирнэ</div>
  </div>

  <div class="lights" role="group" aria-label="Гэрэл асаах, унтраах">
    <button data-light="fill" aria-pressed="true"><i></i>Дүүргэгч</button>
    <button data-light="hair" aria-pressed="true"><i></i>Арын</button>
    <button data-light="key" aria-pressed="true"><i></i>Түлхүүр</button>
  </div>
  <div class="kicker">100×100 · I дэвтэр</div>
  <h1>Математикийн тестүүд</h1>
  <div class="meta">12 бүлэг сэдэв · 30 000₮</div>
  <div class="spacer"></div>
</div>

<script type="module">
  import * as THREE from "three";
  import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";

  const studio = document.getElementById("studio");
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
  document.getElementById("fallback").remove();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  studio.prepend(renderer.domElement);
  RectAreaLightUniformsLib.init();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 60);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const target = new THREE.Vector3(0, 0.70, 0);

  // ---------- Студийн тусгалын орчин: харанхуй өрөөнд гэрэлтэх softbox-ууд ----------
  // Гялгар хавтас эдгээр туузыг тусгаж, бүтээгдэхүүний зургийн урт гялбаа үүснэ.
  const on = { key: true, fill: true, hair: true };
  function studioEnv(mode) {
    const env = new THREE.Scene();
    env.background = new THREE.Color(mode === "dark" ? 0x060508 : 0x6d6a66);
    const box = (w, h, power, pos, tint = 0xffffff) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(power), side: THREE.DoubleSide, toneMapped: false }));
      m.position.set(...pos); m.lookAt(0, 0.7, 0); env.add(m);
    };
    if (on.key)  box(1.3, 5.5, 9, [4.2, 2.2, 2.4], 0xfff3e6);    // түлхүүр: баруун урд 45°, урт тууз
    if (on.fill) box(1.0, 3.6, 3, [-4.4, 1.6, 2.8], 0xeef2ff);   // дүүргэгч: зүүн урд 45°, сул
    box(4.5, 3.0, 2.5, [0, 6.5, 0.6]);                            // дээд сул ойлт
    if (on.hair) box(3.2, 0.9, 9, [-0.4, 3.6, -3.8]);             // арын (үсний) гэрэл: ард дээрээс
    box(6.0, 1.2, mode === "dark" ? 0.4 : 2.2, [0, -0.6, 4.5]);   // доороос сул ойлт
    return pmrem.fromScene(env, 0.02).texture;
  }

  // ---------- Гэрэл: тэгш өнцөгт softbox (RectAreaLight) + сүүдэрт зориулсан нэг чиглэлт гэрэл ----------
  const rect = (color, power, w, h, pos) => { const l = new THREE.RectAreaLight(color, power, w, h); l.position.set(...pos); l.lookAt(target); scene.add(l); return l; };
  // Сонгодог гурван цэгийн гэрэл (дээрээс харвал): түлхүүр баруун урд, дүүргэгч зүүн урд, арын гэрэл ар дээрээс
  const POWER = { key: 9, fill: 2.6, hair: 8 };
  const LIGHTS = {
    key:  rect(0xfff1e0, POWER.key,  1.4, 4.2, [3.4, 2.4, 2.4]),
    fill: rect(0xeef2ff, POWER.fill, 1.2, 3.0, [-3.6, 1.5, 2.8]),
    hair: rect(0xffffff, POWER.hair, 3.0, 0.9, [-0.4, 3.4, -3.0]),
  };
  rect(0xffffff, 1.6, 3.5, 2.5, [0, 5.4, 0.8]);   // дээд сул ойлт — хар сүүдэр үүсгэхгүйн тулд
  const sun = new THREE.DirectionalLight(0xffffff, 0.35);      // зөвхөн зөөлөн сүүдэр гаргана
  sun.position.set(2.4, 6.2, 3.0); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 16; sun.shadow.blurSamples = 25; sun.shadow.bias = -0.0006;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 16 });
  scene.add(sun);

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.3 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  // Ёроолын бараан сүүдэр (ambient occlusion-ийн оронд)
  const cs = document.createElement("canvas"); cs.width = 512; cs.height = 256;
  const cx = cs.getContext("2d"), g = cx.createRadialGradient(256, 128, 4, 256, 128, 250);
  g.addColorStop(0, "rgba(0,0,0,.75)"); g.addColorStop(.35, "rgba(0,0,0,.35)"); g.addColorStop(1, "rgba(0,0,0,0)");
  cx.fillStyle = g; cx.fillRect(0, 0, 512, 256);
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.42), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cs), transparent: true, depthWrite: false }));
  contact.rotation.x = -Math.PI / 2; contact.position.y = 0.002; scene.add(contact);

  // ---------- Ном: зөөлөн хавтастай, хавтас хуудастай тэгш ----------
  const W = 1, H = 1.431, T = 0.104, C = 0.006;
  const loader = new THREE.TextureLoader();
  const tex = src => { const t = loader.load(src, () => request()); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
  const laminate = map => new THREE.MeshPhysicalMaterial({ map, roughness: 0.38, clearcoat: 1, clearcoatRoughness: 0.08, envMapIntensity: 1 });
  const cut = new THREE.MeshStandardMaterial({ color: 0xF6F3EE, roughness: 0.7 });   // хавтасны зүсмэл ирмэг
  function paperTex(vertical) {
    const n = 1024, c = document.createElement("canvas"); c.width = vertical ? n : 4; c.height = vertical ? 4 : n;
    const x = c.getContext("2d"); x.fillStyle = "#F6EEDC"; x.fillRect(0, 0, c.width, c.height);          // офсет цаас: бага зэрэг шаргал
    for (let i = 0; i < n; i += 2) { x.fillStyle = `rgba(150,124,82,${0.07 + Math.random() * 0.11})`; vertical ? x.fillRect(i, 0, 1, 4) : x.fillRect(0, i, 4, 1); }
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
  }
  const paperFore = new THREE.MeshStandardMaterial({ map: paperTex(true), roughness: 0.92 });
  const paperTop = new THREE.MeshStandardMaterial({ map: paperTex(false), roughness: 0.92 });

  const book = new THREE.Group();
  const part = (geo, mats, pos) => { const m = new THREE.Mesh(geo, mats); m.position.set(...pos); m.castShadow = m.receiveShadow = true; book.add(m); };
  // BoxGeometry материалын дараалал: +x, -x, +y, -y, +z, -z
  part(new THREE.BoxGeometry(W, H, C), [cut, cut, cut, cut, laminate(tex("img/100x100-front.jpg")), cut], [0, 0, T / 2 - C / 2]);
  part(new THREE.BoxGeometry(W, H, C), [cut, cut, cut, cut, cut, laminate(tex("img/100x100-back.jpg"))], [0, 0, -T / 2 + C / 2]);
  part(new THREE.BoxGeometry(C, H, T), [cut, laminate(tex("img/100x100-spine.jpg")), cut, cut, cut, cut], [-W / 2 + C / 2, 0, 0]);
  // Хуудас: дээр, доор, баруун ирмэг нь хавтастай яг нэг түвшинд
  part(new THREE.BoxGeometry(W - C, H, T - 2 * C), [paperFore, cut, paperTop, paperTop, cut, cut], [C / 2, 0, 0]);
  book.position.y = H / 2;
  scene.add(book);

  // ---------- Горим ----------
  function setMode(mode) {
    studio.className = "studio " + mode;
    if (scene.environment) scene.environment.dispose();
    scene.environment = studioEnv(mode);
    renderer.toneMappingExposure = mode === "dark" ? 1.0 : 0.92;
    floor.material.opacity = mode === "dark" ? 0.55 : 0.26;
    contact.material.opacity = mode === "dark" ? 1 : 0.7;
    document.querySelectorAll(".ctrl button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    request();
  }
  let mode = "dark";
  document.querySelectorAll(".ctrl button").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); mode = b.dataset.mode; setMode(mode); }));
  document.querySelectorAll(".lights button").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const k = b.dataset.light; on[k] = !on[k];
    LIGHTS[k].intensity = on[k] ? POWER[k] : 0;
    b.setAttribute("aria-pressed", String(on[k]));
    if (k === "key") sun.intensity = on.key ? 0.35 : 0.05;
    setMode(mode);
  }));

  function resize() {
    const { clientWidth: w, clientHeight: h } = studio;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    const portrait = w / h < 1;
    camera.position.set(0, portrait ? 1.02 : 0.95, portrait ? 4.9 : 4.3);
    camera.lookAt(target); camera.updateProjectionMatrix(); request();
  }
  new ResizeObserver(resize).observe(studio);

  // ---------- Эргэлт ----------
  let dragAngle = 0, shown = 0;
  const progress = () => { const r = studio.getBoundingClientRect(), vh = innerHeight; return Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height))); };
  const goal = () => -0.35 + progress() * 1.6 + dragAngle;
  addEventListener("scroll", () => request(), { passive: true });
  let drag = null;
  studio.addEventListener("pointerdown", e => { if (e.target.closest(".ctrl")) return; drag = { x: e.clientX, y: e.clientY, a: dragAngle, id: e.pointerId, axis: null }; });
  studio.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.axis && Math.hypot(dx, dy) > 6) { drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y"; if (drag.axis === "x") studio.setPointerCapture(drag.id); }
    if (drag.axis === "x") { dragAngle = drag.a + dx * 0.008; request(); }
  });
  studio.addEventListener("pointerup", () => drag = null); studio.addEventListener("pointercancel", () => drag = null);

  let raf = 0;
  function request() { if (!raf) raf = requestAnimationFrame(tick); }
  function tick() {
    raf = 0;
    const g = goal(), k = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0.14;
    shown += (g - shown) * k;
    book.rotation.y = shown; contact.rotation.z = -shown;
    renderer.render(scene, camera);
    if (Math.abs(g - shown) > 0.0005) request();
  }
  shown = goal(); setMode("dark"); resize();
</script>
</body>
</html>
