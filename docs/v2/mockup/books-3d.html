<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Номын 3D — студи</title>
<style>
  :root { --bg: #FAF9F6; --ink: #1B1B18; --ink-dim: #5E5A52; --line: #E4E1DA; --book: #6B2A8E; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 120px; }
  .note { font-size: 13px; color: var(--ink-dim); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; background: #fff; }
  .spacer { height: 36vh; display: grid; place-items: end center; color: var(--ink-dim); font-size: 13px; padding-bottom: 12px; }
  .studio { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 4 / 5; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; background: #151318; }
  @media (min-width: 860px) { .studio { aspect-ratio: 16 / 10; } }
  .studio:active { cursor: grabbing; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; }
  .fallback img { width: 52%; max-width: 280px; }
  .ctrl { position: absolute; top: 12px; right: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2; }
  .studio.light .ctrl { background: rgba(0,0,0,.07); }
  .ctrl button { font: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 6px 12px; min-height: 32px; background: transparent; color: rgba(255,255,255,.75); cursor: pointer; }
  .studio.light .ctrl button { color: #55504A; }
  .ctrl button[aria-pressed="true"] { background: rgba(255,255,255,.92); color: #1B1B18; }
  .hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; color: rgba(255,255,255,.45); pointer-events: none; }
  .studio.light .hint { color: #7A756C; }
  .lights { display: flex; justify-content: center; gap: 4px; margin: 12px auto 0; width: max-content; padding: 4px; border-radius: 999px; background: #EFECE6; }
  .lights button { font: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 6px 10px; min-height: 32px; background: transparent; color: #8A847B; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .lights button i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; }
  .lights button[aria-pressed="true"] { color: #1B1B18; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .lights button[aria-pressed="true"] i { background: #F5B942; opacity: 1; box-shadow: 0 0 6px #F5B942; }
  .kicker { margin-top: 22px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--book); font-weight: 700; }
  h1 { font-size: clamp(26px, 6.4vw, 34px); margin: 6px 0 0; letter-spacing: -.015em; line-height: 1.15; }
  .meta { color: var(--ink-dim); font-size: 14px; margin-top: 6px; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div class="wrap">
  <p class="note">Three.js студи. Хэвлэлийн хавтасны файлаас. Гүйлгэхэд эргэнэ, хажуу тийш чирнэ.</p>
  <div class="spacer">Доош гүйлгэ</div>

  <div class="studio dark" id="studio">
    <div class="fallback" id="fallback"><img src="img/100x100-front.jpg" alt="Математикийн тестүүд, I дэвтэр"></div>
    <div class="ctrl" role="group" aria-label="Студийн фон">
      <button data-mode="dark" aria-pressed="true">Бараан</button>
      <button data-mode="light" aria-pressed="false">Цайвар</button>
    </div>
    <div class="hint">Гүйлгэхэд эргэнэ · хажуу тийш чирнэ</div>
  </div>
  <div class="lights" role="group" aria-label="Гэрэл асаах, унтраах">
    <button data-light="fill" aria-pressed="true"><i></i>Дүүргэгч</button>
    <button data-light="hair" aria-pressed="true"><i></i>Арын</button>
    <button data-light="key" aria-pressed="true"><i></i>Түлхүүр</button>
  </div>
  <div class="kicker">100×100 · I дэвтэр</div>
  <h1>Математикийн тестүүд</h1>
  <div class="meta">12 бүлэг сэдэв · 30 000₮</div>
  <div class="spacer"></div>
</div>

<script type="module">
  import * as THREE from "three";
  import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";

  const studio = document.getElementById("studio");
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  document.getElementById("fallback").remove();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  studio.prepend(renderer.domElement);
  RectAreaLightUniformsLib.init();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 60);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const AIM = new THREE.Vector3(0, 0.70, 0);
  const canvasTex = (w, h, draw, srgb = true) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };

  // ===================== Студийн фон (WebGL дотор) =====================
  const BACKDROP = {
    dark:  { glow: "#3A3242", mid: "#17151B", edge: "#0A090C", floor: 0x141217 },
    light: { glow: "#FFFFFF", mid: "#EAE6E0", edge: "#CDC7BD", floor: 0xE6E2DB },
  };
  const backdropTex = mode => canvasTex(1024, 1024, (x, w, h) => {
    const b = BACKDROP[mode], g = x.createRadialGradient(w * .5, h * .42, 0, w * .5, h * .46, w * .78);
    g.addColorStop(0, b.glow); g.addColorStop(.45, b.mid); g.addColorStop(1, b.edge);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  });

  // ===================== Тусгалын орчин: градиент softbox + хар хаалт =====================
  // Гялгар бүтээгдэхүүний зураг: жигд тууз биш, нэг ирмэг нь хар хаалтаар хурц,
  // нөгөө тал нь бүдэгрэн уусдаг градиент тусгал.
  const gradStrip = canvasTex(512, 8, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, "#000"); g.addColorStop(.06, "#fff"); g.addColorStop(.32, "#e8e8e8"); g.addColorStop(1, "#000");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }, false);
  const gradTop = canvasTex(8, 512, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#fff"); g.addColorStop(1, "#000");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  }, false);

  const on = { key: true, fill: true, hair: true };
  function studioEnv(mode) {
    const env = new THREE.Scene();
    env.background = new THREE.Color(mode === "dark" ? 0x040305 : 0x5c5955);
    const panel = (w, h, power, pos, map, tint = 0xffffff, flipX = false) => {
      const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(tint).multiplyScalar(power), map, side: THREE.DoubleSide, toneMapped: false });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      m.position.set(...pos); m.lookAt(AIM); if (flipX) m.scale.x = -1; env.add(m);
    };
    const flag = (w, h, pos) => panel(w, h, 0, pos, null);   // хар хаалт: гэрэл огт өгөхгүй
    if (on.key)  { panel(1.5, 5.6, 5, [4.0, 2.3, 2.6], gradStrip, 0xfff2e2); flag(0.6, 5.8, [3.0, 2.3, 3.4]); }
    if (on.fill) panel(1.2, 3.8, 1.8, [-4.2, 1.6, 3.0], gradStrip, 0xeef2ff, true);
    if (on.hair) panel(3.4, 1.0, 9, [-0.3, 3.8, -3.8], null);
    panel(5.0, 3.4, mode === "dark" ? 0.9 : 1.6, [0, 6.6, 0.8], gradTop);   // дээд softbox, урдаас ар руу уусна
    if (mode === "light") panel(7, 1.4, 1.6, [0, -0.6, 4.6], null);           // цайвар шалнаас ойх гэрэл
    return pmrem.fromScene(env, 0.015).texture;
  }

  // ===================== Гэрэл =====================
  // Схем (дээрээс): түлхүүр баруун урд 45°, дүүргэгч зүүн урд 45°, арын гэрэл ар дээрээс.
  const rect = (color, power, w, h, pos) => { const l = new THREE.RectAreaLight(color, power, w, h); l.position.set(...pos); l.lookAt(AIM); scene.add(l); return l; };
  const POWER = { key: 6, fill: 1.8, hair: 7.5 };
  const LIGHTS = {
    key:  rect(0xfff1e0, POWER.key,  1.6, 4.4, [3.4, 2.4, 2.6]),
    fill: rect(0xeef2ff, POWER.fill, 1.4, 3.2, [-3.6, 1.5, 3.0]),
    hair: rect(0xffffff, POWER.hair, 3.2, 1.0, [-0.3, 3.4, -3.0]),
  };
  rect(0xffffff, 1.4, 4.0, 3.0, [0, 5.6, 0.8]);
  const sun = new THREE.DirectionalLight(0xffffff, 0.3);       // зөвхөн зөөлөн сүүдэр
  sun.position.set(2.4, 6.2, 3.0); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 16; sun.shadow.blurSamples = 25; sun.shadow.bias = -0.0006;
  Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4, near: 0.5, far: 16 });
  scene.add(sun);

  // ===================== Шал =====================
  // Тусдаа шалны хавтгай байхгүй: фон завсаргүй үргэлжилнэ, тэнгэрийн хаяаны зураас гарахгүй.
  // Цайвар: зөвхөн сүүдэр. Бараан: акрил мэт бүдэг ойлт (номын толин тусгал, доошоо уусна).
  const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.ShadowMaterial({ opacity: 0.22 }));
  shadowFloor.rotation.x = -Math.PI / 2; shadowFloor.receiveShadow = true; scene.add(shadowFloor);
  const contactTex = canvasTex(512, 256, (x, w, h) => {
    const g = x.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, w * .49);
    g.addColorStop(0, "rgba(0,0,0,.8)"); g.addColorStop(.3, "rgba(0,0,0,.35)"); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  });
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.36), new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false }));
  contact.rotation.x = -Math.PI / 2; contact.position.y = 0.003; scene.add(contact);

  // ===================== Ном: нэг цул биет — завсар, зураас үүсэхгүй =====================
  const W = 1, H = 1.422, T = 0.112;          // хавтасны эх файлаас: 498 × 708, нуруу 56 px
  const loader = new THREE.TextureLoader();
  const coverTex = src => { const t = loader.load(src, () => request()); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
  const laminate = map => new THREE.MeshPhysicalMaterial({ map, roughness: 0.34, clearcoat: 1, clearcoatRoughness: 0.06 });
  // Хуудасны ирмэг: шаргалдуу офсет цаас, хоёр захад хавтасны нимгэн цагаан ирмэг
  const paperEdge = across => canvasTex(across ? 1024 : 8, across ? 8 : 1024, (x, w, h) => {
    const n = Math.max(w, h); x.fillStyle = "#F6EEDC"; x.fillRect(0, 0, w, h);
    for (let i = 0; i < n; i += 2) { x.fillStyle = `rgba(150,124,82,${0.05 + Math.random() * 0.09})`; across ? x.fillRect(i, 0, 1, h) : x.fillRect(0, i, w, 1); }
    x.fillStyle = "#FAF8F4"; const e = Math.round(n * 0.03);
    across ? (x.fillRect(0, 0, e, h), x.fillRect(w - e, 0, e, h)) : (x.fillRect(0, 0, w, e), x.fillRect(0, h - e, w, e));
  });
  const pageSide = new THREE.MeshStandardMaterial({ map: paperEdge(true), roughness: 0.9 });
  const pageTop = new THREE.MeshStandardMaterial({ map: paperEdge(false), roughness: 0.9 });
  // BoxGeometry материалын дараалал: +x ирмэг, −x нуруу, +y дээд, −y доод, +z урд, −z ар
  const book = new THREE.Mesh(new THREE.BoxGeometry(W, H, T), [
    pageSide, laminate(coverTex("img/100x100-spine.jpg")), pageTop, pageTop,
    laminate(coverTex("img/100x100-front.jpg")), laminate(coverTex("img/100x100-back.jpg")),
  ]);
  book.castShadow = true; book.position.y = H / 2; scene.add(book);
  // Акрил ойлт: номын толин хуулбар, шалнаас холдох тусам уусна (~18%)
  const fadeReflection = m => {
    const c = m.clone(); c.transparent = true; c.depthWrite = false;
    c.onBeforeCompile = sh => {
      sh.vertexShader = "varying float vY;\n" + sh.vertexShader.replace("#include <project_vertex>", "#include <project_vertex>\n  vY = (modelMatrix * vec4(transformed, 1.0)).y;");
      sh.fragmentShader = "varying float vY;\n" + sh.fragmentShader.replace("#include <dithering_fragment>", "#include <dithering_fragment>\n  gl_FragColor.a *= 0.18 * smoothstep(-0.55, 0.0, vY);");
    };
    return c;
  };
  const reflection = new THREE.Mesh(book.geometry, book.material.map(fadeReflection));
  reflection.scale.y = -1; reflection.position.y = -H / 2; scene.add(reflection);

  // ===================== Горим =====================
  let mode = "dark";
  function setMode(m) {
    mode = m; studio.className = "studio " + m;
    scene.background?.dispose?.(); scene.background = backdropTex(m);
    scene.environment?.dispose?.(); scene.environment = studioEnv(m);
    const dark = m === "dark";
    reflection.visible = dark; shadowFloor.material.opacity = dark ? 0.0 : 0.22;
    contact.material.opacity = dark ? 0.9 : 0.75;
    renderer.toneMappingExposure = dark ? 0.95 : 0.88;
    document.querySelectorAll(".ctrl button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
    request();
  }
  document.querySelectorAll(".ctrl button").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); setMode(b.dataset.mode); }));
  document.querySelectorAll(".lights button").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.light; on[k] = !on[k];
    LIGHTS[k].intensity = on[k] ? POWER[k] : 0;
    if (k === "key") sun.intensity = on.key ? 0.3 : 0.04;
    b.setAttribute("aria-pressed", String(on[k]));
    setMode(mode);
  }));

  function resize() {
    const { clientWidth: w, clientHeight: h } = studio;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    const portrait = w / h < 1;
    camera.position.set(0, portrait ? 1.0 : 0.92, portrait ? 4.9 : 4.3);
    camera.lookAt(AIM); camera.updateProjectionMatrix(); request();
  }
  new ResizeObserver(resize).observe(studio);

  // ===================== Эргэлт =====================
  let dragAngle = 0, shown = 0;
  const progress = () => { const r = studio.getBoundingClientRect(), vh = innerHeight; return Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height))); };
  const goal = () => -0.35 + progress() * 1.6 + dragAngle;
  addEventListener("scroll", () => request(), { passive: true });
  let drag = null;
  studio.addEventListener("pointerdown", e => { if (e.target.closest(".ctrl")) return; drag = { x: e.clientX, y: e.clientY, a: dragAngle, id: e.pointerId, axis: null }; });
  studio.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.axis && Math.hypot(dx, dy) > 6) { drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y"; if (drag.axis === "x") try { studio.setPointerCapture(drag.id); } catch {} }
    if (drag.axis === "x") { dragAngle = drag.a + dx * 0.008; request(); }
  });
  studio.addEventListener("pointerup", () => drag = null); studio.addEventListener("pointercancel", () => drag = null);

  let raf = 0;
  function request() { if (!raf) raf = requestAnimationFrame(tick); }
  function tick() {
    raf = 0;
    const g = goal(), k = matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0.14;
    shown += (g - shown) * k;
    book.rotation.y = reflection.rotation.y = shown; contact.rotation.z = -shown;
    renderer.render(scene, camera);
    if (Math.abs(g - shown) > 0.0005) request();
  }
  shown = goal(); setMode("dark"); resize();
</script>
</body>
</html>
