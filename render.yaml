databases:
  - name: pimn-db
    databaseName: pimn
    user: pimn
    plan: free

services:
  - type: web
    name: pimn-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pimn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://placeholder.vercel.app
      - key: NODE_VERSION
        value: 22.23.1
