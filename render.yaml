# Pi.mn — Render Blueprint
#
# ⚠️ БАГЦЫГ (plan) ЭНЭ ФАЙЛААС БУС, Render Dashboard-ээс сайжруулна
#    (төлбөрийн үйлдэл тул гараар хийнэ). Дэлгэрэнгүйг DEPLOY.md-ээс үзнэ үү.
#
# free багцын хязгаарлалт:
#   • Postgres 30 хоногийн дараа УСТДАГ
#   • Диск байхгүй тул байршуулсан файл redeploy бүрт АЛГА БОЛДОГ
#   • Идэвхгүй үед сервис унтардаг (эхний хүсэлт удаан ирдэг)

databases:
  - name: pimn-db
    databaseName: pimn
    user: pimn
    # ⚠️ 30 хоногийн дараа устана → basic-256mb буюу дээш рүү сайжруулна
    plan: free

services:
  - type: web
    name: pimn-api
    runtime: node
    # ⚠️ free нь идэвхгүй үед унтардаг → starter руу сайжруулна
    plan: free
    rootDir: api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod

    # Тогтвортой диск — байршуулсан зураг/PDF-ийг redeploy хооронд хадгална.
    #
    # 🚨 free багц дээр disk ДЭМЖИГДЭХГҮЙ. Render-ийн баримт бичигт free web
    #    service-ийн хязгаарлалтад "Persistent disks" гэж шууд заасан бөгөөд
    #    Render API дээр ч disk = null (үүсээгүй) байна.
    #    → Идэвхтэй үлдээвэл Blueprint sync АЛДААТАЙ дуусна.
    #
    # ✅ ДАРААХ 2 АЛХМААР СЭРГЭЭНЭ (багцаа starter+ болгосны дараа):
    #    1) plan: free → starter (дээрх мөр)
    #    2) доорх disk болон UPLOAD_DIR-ын тайлбарын тэмдгийг (#) авах
    #
    # ⚠️ Диск идэвхжих хүртэл байршуулсан ЗУРАГ/PDF redeploy бүрт УСТАНА.
    # disk:
    #   name: pimn-uploads
    #   mountPath: /var/data/uploads
    #   sizeGB: 5

    envVars:
      # ⚠️ Render-ийн `fromDatabase` connectionString нь query параметргүй
      #    (connection_limit/pool_timeout/pgbouncer) цэвэр URL өгдөг — эдгээрийг
      #    ЭНД биш, DB_POOL_MAX/DB_POOL_CONNECT_TIMEOUT_MS/DB_STATEMENT_TIMEOUT_MS
      #    env-ээр удирддаг (доор). Гадаад PgBouncer/Supavisor ашиглах шаардлага
      #    гарвал л DATABASE_URL-д `?pgbouncer=true&connection_limit=..` нэмнэ —
      #    api/.env.example-д дэлгэрэнгүй тайлбарласан.
      - key: DATABASE_URL
        fromDatabase:
          name: pimn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

      # 🔑 Нууц үг сэргээх кодыг HMAC-аар хэшлэх нууц түлхүүр.
      # Тусад нь байснаар JWT_SECRET-ийг эргүүлэхэд идэвхтэй сэргээх кодууд
      # эвдрэхгүй, мөн эсрэгээр. Тохируулаагүй бол JWT_SECRET рүү буцаж унана.
      - key: RESET_TOKEN_SECRET
        generateValue: true

      # 📱 SMS нийлүүлэгч — нууц үг сэргээх код ЭНЭ сувгаар явна.
      #
      # ⚠️ ТОХИРУУЛААГҮЙ БОЛ: продакшнд /auth/forgot-password нь 503 буцааж,
      #    "SMS үйлчилгээ тохируулагдаагүй" гэж ИЛЭН ДАЛАНГҮЙ хэлнэ. Дуугүй
      #    "илгээлээ" гэж хуурахгүй — сурагч хүлээсээр хоцрохоос сэргийлнэ.
      #
      # Сонголт А — Twilio (+976 дэмждэг, картаар шууд бүртгүүлнэ):
      # - key: SMS_PROVIDER
      #   value: twilio
      # - key: TWILIO_ACCOUNT_SID
      #   sync: false            # Render UI-аас гараар оруулна (нууц)
      # - key: TWILIO_AUTH_TOKEN
      #   sync: false
      # - key: TWILIO_FROM
      #   sync: false            # ж: +1XXXXXXXXXX эсвэл зөвшөөрөгдсөн Sender ID
      #
      # Сонголт Б — дотоодын агрегатор (Mobicom/Unitel/Skytel-тэй шууд):
      # - key: SMS_PROVIDER
      #   value: http
      # - key: SMS_HTTP_URL
      #   sync: false            # ж: https://api.жишээ.mn/sms?to={to}&text={text}
      # - key: SMS_HTTP_METHOD
      #   value: GET
      # - key: SMS_HTTP_HEADERS
      #   sync: false            # ж: {"Authorization":"Bearer ..."}

      # 💳 QPay merchant холболт — сургалтын төлбөрийг банкны аппаар авна.
      #
      # ⚠️ ТОХИРУУЛААГҮЙ БОЛ: QpayService.isConfigured() худал буцаана
      #    (qpay.service.ts:85-97 эдгээр 5 хувьсагчийг шалгадаг) тул QPay
      #    сонгосон төлбөр 400 алдаа өгнө. Бэлэн/данс шилжүүлэг ажиллана.
      #
      # ⚠️ ЭНЭ БОЛ ЭЗНИЙ АЖИЛ. Merchant гэрээ байгуулж, client_id/secret-ийг
      #    QPay-ээс авах нь данс нээх, төлбөр төлөх үйлдэл — Claude хийхгүй.
      #    Гэрээ хийсний дараа доорх мөрүүдийн тайлбарыг авч, нууц утгуудыг
      #    Render UI-аас гараар оруулна (sync: false тул git-д ОРОХГҮЙ).
      #
      # Эхлээд SANDBOX дээр туршина:
      #   QPAY_BASE_URL = https://merchant-sandbox.qpay.mn
      # Продакшнд шилжихдээ зөвхөн энэ мөрийг сольно:
      #   QPAY_BASE_URL = https://merchant.qpay.mn
      #
      # - key: QPAY_BASE_URL
      #   value: https://merchant-sandbox.qpay.mn
      # - key: QPAY_CLIENT_ID
      #   sync: false            # QPay-ээс өгнө (нууц)
      # - key: QPAY_CLIENT_SECRET
      #   sync: false            # QPay-ээс өгнө (нууц)
      # - key: QPAY_INVOICE_CODE
      #   sync: false            # ж: PIMN_INVOICE — merchant дээр бүртгүүлсэн код
      # - key: QPAY_CALLBACK_URL
      #   value: https://pimn-api.onrender.com/api/payments/qpay/callback
      #                          # ⚠️ Бодит зам нь payments.controller.ts-тэй
      #                          #    ТААРАХ ёстой. Өөрчилвөл QPay merchant
      #                          #    самбар дээр ч мөн шинэчилнэ.
      # - key: QPAY_TOKEN_TTL_FALLBACK_SECONDS
      #   value: "3600"          # QPay expires_in буцаахгүй бол хэрэглэнэ

      # 🔌 pg pool sizing (src/prisma/prisma.service.ts-ийн тайлбарыг үз) —
      # НЭГ instance-д зориулсан утга. Хэрэв instance-ийн тоог нэмбэл (horizontal
      # scale) энэ тоог instance тоогоор хувааж бууруулах ёстой — эс тэгвээс
      # нийт холболтын тоо Render Postgres-ийн max_connections-ийг давж болзошгүй.
      #
      # 📐 ТООЦОО (2026-08-08, 2000 зэрэг шалгалтын зорилтод):
      #   2000 сурагч × (1 autosave / 1.2с)          ≈ 1667 бичих/сек
      #   1667 × 15мс дундаж хугацаа                  ≈ 25 зэрэг холболт
      #   Тиймээс 15 нь ХАНГАЛТГҮЙ — pool дүүрч, хүсэлт дараалалд ороод
      #   DB_POOL_CONNECT_TIMEOUT_MS (5с) дараа алдаа өгнө.
      #   25 болгож нэмэв: нөөцтэй, Render Postgres-ийн max_connections
      #   (үнэгүй багц ≈ 97, бусад үйлчилгээтэй хуваалцана) дотор аюулгүй.
      #
      # ⚠️ ГЭХДЭЭ POOL НЬ ЖИНХЭНЭ ШИЙДЭЛ БИШ. 1667 бичих/сек нь жижиг
      #    Postgres-д хэт их. Холболт нэмбэл саад зөвхөн ӨС рүү шилжинэ.
      #    Жинхэнэ шийдэл нь БИЧИХ ДАВТАМЖИЙГ бууруулах (autosave-ийн
      #    debounce уртасгах, зөвхөн өөрчлөгдсөнийг илгээх, багцлах).
      #    2000 зэрэг хэрэглэгчид НЭМЖ шаардагдах зүйл (эзний шийдвэр):
      #      • Render-ийн төлбөртэй Postgres багц (max_connections өндөр)
      #      • API-г 2-3 instance болгох + энэ тоог instance тоонд хуваах
      #      • Эсвэл PgBouncer/Supavisor (transaction pooling) — тэр үед
      #        DATABASE_URL-д ?pgbouncer=true&connection_limit=.. нэмнэ
      - key: DB_POOL_MAX
        value: "25"
      - key: DB_POOL_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: DB_STATEMENT_TIMEOUT_MS
        value: "10000"

      # Vercel дээрх БОДИТ frontend домэйн ("placeholder.vercel.app" байсныг зассан).
      # Өөрийн домэйн холбосон бол энд түүнийг бичнэ.
      - key: WEB_ORIGIN
        value: https://web-one-pi-59.vercel.app

      # Байршуулсан файлыг тогтвортой диск рүү чиглүүлнэ.
      #
      # ⚠️ ДЭЭРХ disk-ТЭЙ ХАМТ Л ИДЭВХЖҮҮЛНЭ. Диск mount хийгээгүй байхад энэ
      #    замыг өгвөл /var/data руу бичих эрх байхгүй тул uploads.controller.ts
      #    дэх mkdirSync модуль ачаалах үедээ шидэж, Nest БҮХЭЛДЭЭ БОСОХГҮЙ
      #    болох эрсдэлтэй (одоо тэр код хамгаалагдсан ч зам нь тохирохгүй).
      #    Тохируулаагүй үед ./uploads руу буцаж унана — түр зуурынх ч ажилладаг.
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads

      - key: NODE_VERSION
        value: 22.23.1
