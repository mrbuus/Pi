# Анимацын слотууд — docs/RESEARCH-2026-11.md §4, заавар: assets/anim/README.md
#
# Слот бүр (lib/shared/anim/anim_slot.dart-ийн AnimSlot) энд НЭГ мөртэй байна — тест шалгана.
# Файл байхгүй бол апп одоогийн дүрсээ (fallback) харуулна; файл хуулбал код өөрчлөхгүй.
#
#   kind          lottie | video | rive
#   file          үндсэн файл (assets/-ээр эхэлбэл бүтэн зам, эс бөгөөс assets/anim/-ээс)
#   dark          харанхуй горимын хувилбар (заавал биш)
#   poster        эхний кадр, хөдөлгөөн багасгах горим ба хуучин утсанд (заавал биш, зөвлөнө)
#   poster_dark   харанхуй горимын poster (заавал биш)
#   loop          давтагдах эсэх (нэг удаад ганц давталттай слот тоглоно)
#   seconds       зорилтот урт
#   max_kb        файлын дээд хэмжээ (тест шалгана)
#   poster_max_kb poster-ын дээд хэмжээ (өгөгдмөл 40)

slots:
  login_hero:
    kind: video
    file: assets/login_hero/hero.mp4
    dark: assets/login_hero/hero_dark.mp4
    poster: assets/login_hero/poster.webp
    poster_dark: assets/login_hero/poster_dark.webp
    loop: true
    seconds: 6
    max_kb: 1536
    poster_max_kb: 150

  onboarding_1:
    kind: lottie
    file: onboarding_1.json
    dark: onboarding_1.dark.json
    poster: onboarding_1.poster.webp
