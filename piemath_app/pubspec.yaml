name: piemath_app
description: "Piemath — Шинэ ирээдүйн эзэд сургалтын төвийн гар утасны апп"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

# Шинэ сан нэмэхээс өмнө docs/PERFORMANCE.md §2 (хэмжээ, нативаар юу татдаг).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.3
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter_image_compress: ^2.5.1
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  # Lucide-ийн зөвхөн хэрэглэсэн глифтэй орлуулагч (API ижил) — tool/icon_font/build_icon_font.py.
  lucide_icons_flutter:
    path: tool/icon_font/lucide_icons_flutter
  mobile_scanner: ^7.4.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfx: ^2.11.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.10.0
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  # Анимацын слот (lib/shared/anim, assets/anim/README.md): цэвэр Dart, native сангүй. Rive НЭМЭХГҮЙ.
  lottie: ^3.8.2
  # assets/anim/manifest.yaml-ийг унших (цэвэр Dart, өмнө нь transitive байсан).
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Гүйцэтгэлийн хэмжилт: integration_test/perf_test.dart + test_driver/perf_driver.dart.
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/login_hero/
    - assets/anim/

  # Вэбийн web/public/fonts-оос (OFL) tool/build_fonts.py-аар TTF болгосон.
  # Ажиллах үед сүлжээнээс фонт ХЭЗЭЭ Ч татахгүй.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
    # ₮ (U+20AE) — Onest, Unbounded-д байхгүй; DejaVu Sans-аас зөвхөн энэ тэмдэгт (LICENSE-DejaVu.txt)
    - family: PiemathSymbols
      fonts:
        - asset: assets/fonts/PiemathSymbols.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
