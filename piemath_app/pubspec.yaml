name: piemath_app
description: "Piemath — Шинэ ирээдүйн эзэд сургалтын төвийн гар утасны апп"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.7

# Шинэ сан нэмэхээс өмнө docs/PERFORMANCE.md §2 (хэмжээ, нативаар юу татдаг).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.3
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter_image_compress: ^2.5.1
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  go_router: ^18.1.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.1
  mobile_scanner: ^7.4.3
  path_provider: ^2.1.6
  pdf: ^3.13.1
  pdfx: ^2.11.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  # Вэбийн web/public/fonts-оос (OFL) tool/build_fonts.py-аар TTF болгосон.
  # Ажиллах үед сүлжээнээс фонт ХЭЗЭЭ Ч татахгүй.
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
