# Үүсгэх: dart run flutter_native_splash:create
# Бүтэн лого хамгийн түрүүнд (эзэн 2026-11-14): лого + «Shine ireeduin ezed» бичвэр. Дэвсгэр нь апп-ын `bg`
# токентой ижил тул доорх Flutter-ийн эхлэх дэлгэц ([SplashScreen]) рүү анзаарагдахгүй шилжинэ.
# Хар горимд бичвэр нь цагаан хувилбар (вэбийн LogoMark-тай адил).
flutter_native_splash:
  color: "#F5F7FB"
  image: assets/branding/splash-wordmark-light.png
  color_dark: "#0F1319"
  image_dark: assets/branding/splash-wordmark-dark.png
  # Android 12+ системийн splash зөвхөн дугуй тэмдэг зөвшөөрдөг (бичвэргүй) — бүтэн лого нь
  # Flutter-ийн эхлэх дэлгэцэд шууд дараа нь гарна.
  android_12:
    color: "#F5F7FB"
    image: assets/branding/splash-android12.png
    icon_background_color: "#273F74"
    color_dark: "#0F1319"
    image_dark: assets/branding/splash-android12.png
    icon_background_color_dark: "#273F74"
  fullscreen: false
  ios_content_mode: center
  android_gravity: center
