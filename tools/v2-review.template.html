<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi.mn v2 — ажлын хяналт</title><style>:root{--bg:#f5f7fa;--panel:#fff;--ink:#172132;--muted:#536176;--line:#dce3ec;--brand:#254daa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}header,main{max-width:1050px;margin:auto;padding:24px}header{padding-bottom:8px}h1{font-size:28px;margin:0}p{color:var(--muted)}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:10px;background:var(--panel);color:var(--ink)}button{cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--brand)}nav{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:2}input[type=search]{flex:1;min-width:180px}article,section.sources{padding:20px;margin:14px 0;border:1px solid var(--line);border-radius:16px;background:var(--panel)}h2,h3{margin:0;font-size:18px}.badge{display:inline-block;font-size:13px;font-weight:700;background:#dce8fc;color:#204798;border-radius:20px;padding:4px 10px}.tested{background:#e2f3e9;color:#185b39}.partial{background:#ece9fa;color:#473179}.future{background:#222b39;color:#fff}.external-config{background:#eee;color:#414a57}summary{min-height:44px;cursor:pointer;display:list-item;padding-top:8px}textarea{display:block;width:100%;margin-top:8px}code{overflow-wrap:anywhere;font-size:13px}a{color:var(--brand)}label.check{display:flex;align-items:center;gap:10px;margin:10px 0}input[type=checkbox]{width:24px;height:24px}small{color:var(--muted)}.hidden{display:none}#message{min-height:24px;color:var(--brand)}@media(max-width:600px){header,main{padding:16px}h1{font-size:24px}article{padding:16px}}</style><header><h1>Pi.mn v2 — ажлын хяналт</h1><p>Шинэ Ирээдүйн Эзэд. Сургалтын ажиллагаанаас тусдаа хөгжүүлэлтийн хяналт.</p><p id="limits"></p><a href="MASTER-PROMPT.md">Хөгжүүлэх даалгавар</a> / <a href="REQUIREMENT-COVERAGE.md">Шаардлагын нотолгоо</a> / <a href="RESEARCH-EXTENSION.md">Судалгааны тайлбар</a></header><main><nav><input id="search" type="search" aria-label="Ажлаас хайх" placeholder="Онол, зураг, Word, түүх…"><select id="filter" aria-label="Төлөв"><option value="all">Бүх төлөв</option><option value="tested">Туршсан</option><option value="implemented">Кодод орсон</option><option value="partial">Дутуу хэсэгтэй</option><option value="external-config">Гадаад тохиргоо</option><option value="future">Дараагийн шат</option></select><button id="export">Тэмдэглэл татах</button><button id="import">Тэмдэглэл оруулах</button><input class="hidden" type="file" id="file" accept="application/json"></nav><p id="message" role="status"></p><p id="count"></p><div id="items"></div><section class="sources"><h2>Судалгааны эхүүд</h2><p id="sources-count"></p><div id="sources"></div></section></main><script>const data=__DATA__;const key='pi-v2-review-v1',status={tested:'Туршсан',implemented:'Кодод орсон',partial:'Дутуу хэсэгтэй','external-config':'Гадаад тохиргоо',future:'Дараагийн шат'};let notes={};try{notes=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const el=id=>document.getElementById(id);el('limits').textContent=data.limits;function save(){try{localStorage.setItem(key,JSON.stringify(notes));el('message').textContent='Тэмдэглэл энэ төхөөрөмж дээр хадгалагдлаа.'}catch{el('message').textContent='Төхөөрөмжид хадгалж чадсангүй. Тэмдэглэлээ татаж аваарай.'}}function text(tag,value){const n=document.createElement(tag);n.textContent=value;return n}function render(){const q=el('search').value.toLowerCase(),f=el('filter').value,items=data.items.filter(i=>(f==='all'||i.status===f)&&JSON.stringify(i).toLowerCase().includes(q));el('items').replaceChildren();el('count').textContent=items.length+' / '+data.items.length+' ажил';for(const i of items){const a=document.createElement('article'),b=text('span',status[i.status]);b.className='badge '+i.status;a.append(b,text('h2',i.id+' '+i.title),text('p',i.workflow));const d=document.createElement('details');d.append(text('summary','Нотолгоо, шалгах нөхцөл ба эх код'),text('p',i.verification),text('p',i.acceptanceTest),text('p',i.evidenceSource));for(const limit of i.limitations)d.append(text('p','Хязгаар: '+limit));for(const p of i.actualFiles)d.append(text('code',p),document.createElement('br'));a.append(d);const l=document.createElement('label');l.className='check';const c=document.createElement('input');c.type='checkbox';c.checked=!!notes[i.id]?.checked;c.onchange=()=>{notes[i.id]={checked:c.checked,comment:notes[i.id]?.comment||''};save()};l.append(c,text('span','Би уншиж хянасан'));a.append(l);const t=document.createElement('textarea');t.rows=2;t.maxLength=2000;t.placeholder='Засах зүйлээ тэмдэглэх';t.setAttribute('aria-label',i.id+' тэмдэглэл');t.value=notes[i.id]?.comment||'';t.oninput=()=>{notes[i.id]={checked:!!notes[i.id]?.checked,comment:t.value};save()};a.append(t);el('items').append(a)}}el('search').oninput=render;el('filter').onchange=render;el('export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,notes},null,2)],{type:'application/json'}));a.href=u;a.download='pi-v2-review-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};el('import').onclick=()=>el('file').click();el('file').onchange=async()=>{try{const file=el('file').files[0];if(!file||file.size>500000)throw Error();const x=JSON.parse(await file.text()),allowed=new Set(data.items.map(i=>i.id));if(x.version!==1||!x.notes||typeof x.notes!=='object'||Array.isArray(x.notes))throw Error();const n={};for(const[id,v]of Object.entries(x.notes)){if(!allowed.has(id)||!v||typeof v!=='object'||typeof v.checked!=='boolean'||typeof v.comment!=='string'||v.comment.length>2000)throw Error();n[id]={checked:v.checked,comment:v.comment}}notes={...notes,...n};save();render()}catch{el('message').textContent='Файл тохирохгүй байна. Өмнөх тэмдэглэл хэвээр.'}};el('sources-count').textContent=data.research.length+' эх; шинэ судалгааны '+data.researchCounts.new_intellectual_papers+' ажил. Өмнөх сангийн бодит тоо баталгаажаагүй тул хоёр дахин өссөн гэж зарлаагүй.';for(const s of data.research){const d=document.createElement('details');d.append(text('summary',s.id+' '+s.title));const a=text('a','Анхдагч эх сурвалж');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';d.append(a,text('p',s.application),text('p','Хязгаар: '+s.limits),text('p','Лиценз: '+s.license));el('sources').append(d)}render();</script></html>
